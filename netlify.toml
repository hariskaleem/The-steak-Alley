[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "build"

[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"
  included_files = ["../backend/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200